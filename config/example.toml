# Copy to local.toml. Paths are resolved relative to THIS config directory.
# Paste API keys in Model settings to save them in the ignored local .env file.
# Never put actual credentials in this configuration.
[app]
output_dir = "../outputs"
env_file = "../.env"
port = 8765

[lean]
project_path = "../runtime/mathlib"
command = ["lake", "env", "lean"]
timeout_seconds = 240
# The launcher adds the locally installed tools to PATH. Set [] to disable LSP.
lsp_command = ["lean-lsp-mcp"]

[retrieval]
enabled = true
required = true
command = ["lean-explore", "mcp", "serve", "--backend", "local"]
cache_dir = "../runtime/lean-explore/cache"
hf_cache_dir = "../runtime/huggingface"
data_version = "20260714_172516"
limit = 12
source_limit = 4
rerank_top = 0
max_task_queries = 5
max_outline_queries = 2
max_queries = 7
max_query_chars = 4000
outline_query_chars = 240
formal_chars = 12000
discussion_chars = 6000
fresh_chars = 8000
informal_chars = 4000

[limits]
max_formal_attempts = 5
max_informal_rounds = 3
feedback_chars = 8000
failure_chars = 6000
failure_pairs = 2
informal_packet_chars = 16000

# OpenAI and Anthropic endpoints are included by the application. Set the
# provider and model together for each override, and use budgets the model supports.
# For a user-managed model server, add its provider as described in docs/SETUP.md.

[roles.formal_initial]
provider = "anthropic"
model = "claude-sonnet-5-5"
input_tokens = 8192
output_tokens = 32000
context_tokens = 40960

[roles.formal_reviser]
provider = "anthropic"
model = "claude-sonnet-5-5"
input_tokens = 12288
output_tokens = 24576
context_tokens = 40960

[roles.informal_generator]
provider = "anthropic"
model = "claude-sonnet-5-5"
input_tokens = 8192
output_tokens = 16384
context_tokens = 32768

[roles.informal_reviewer]
provider = "anthropic"
model = "claude-sonnet-5-5"
input_tokens = 12288
output_tokens = 8192
context_tokens = 32768

[roles.discussion]
provider = "anthropic"
model = "claude-sonnet-5-5"
input_tokens = 12288
output_tokens = 12288
context_tokens = 32768

[roles.fresh_formal]
provider = "anthropic"
model = "claude-sonnet-5-5"
input_tokens = 8192
output_tokens = 32000
context_tokens = 40960
