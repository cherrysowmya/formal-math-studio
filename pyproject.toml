[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "formal-math-studio"
version = "0.1.0"
description = "A local Lean proof workspace with configurable agent model providers"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.scripts]
formal-math-studio = "formal_math.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
formal_math = ["static/*"]
